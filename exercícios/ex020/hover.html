<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
    body {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
    div > p {
        display: none;
    }

    div:hover > p {
        display: block;
        color: white;
        background-color: purple;
        width: 350px;
    }

    </style>
</head>
<body>
    <h1>Dando Exemplo de hover</h1>
     <div> Passe o mouse aqui.
        <p>TEXTO ESCONDIDO......</p>
     </div>
     <p>Fim do Exemplo</p>
</body>
</html>
