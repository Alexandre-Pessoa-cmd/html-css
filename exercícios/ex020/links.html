<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* 
        # = id
        . = class
        : = pseudo-class
        ::pseudo-element
        > = cilindred
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: darkred;
            text-decoration: none;
        }

        a:visited {
            color: green;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <h1>Personalizando  links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">Github</a></li>
        <li><a href="https://youtube.cursoemvideo">Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com">Curso em Vídeo</a></li>
    </ul>
</body>
</html>
